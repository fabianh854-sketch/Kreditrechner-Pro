document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lor-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: 5; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius 0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 16v-4\"><\u002Fpath><path d=\"M12 8h.01\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Flabel>\n              <input class=\"input\" type=\"text\" sc-camel-input-mode=\"decimal\" value=\"{{ fDown.value }}\" sc-camel-on-change=\"{{ fDown.onChange }}\" sc-camel-on-focus=\"{{ fDown.onFocus }}\" sc-camel-on-blur=\"{{ fDown.onBlur }}\" style=\"width: 100px; text-align: right; font-weight: 700; background: var(--color-bg)\">\n            <\u002Fdiv>\n            <sc-if value=\"{{ infoDown.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;gap:var(--space-3);align-items:flex-start;justify-content:space-between;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);background:var(--color-accent-2-100);color:var(--color-accent-2-900);font-size:13px;line-height:1.5\"><span style=\"text-wrap:pretty\">Anteil der Anzahlung am Kaufpreis des Fahrzeugs. Empfohlen sind 20–30 %, das senkt Zinskosten und verbessert die Chance auf eine Kreditzusage.<\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ infoDown.toggle }}\" aria-label=\"Erklärung schließen\" style=\"border:0;background:transparent;cursor:pointer;padding:2px;color:var(--color-accent-2-800);flex:none;display:flex\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n            <\u002Fsc-if>\n            <input type=\"range\" min=\"0\" max=\"30000\" step=\"250\" value=\"{{ down }}\" sc-camel-on-change=\"{{ onDown }}\" style=\"width:100%;background:linear-gradient(to right, var(--color-accent-400) {{ pDown }}, var(--color-neutral-300) {{ pDown }})\">\n            <div style=\"display:flex;justify-content:spac pan style=\"color:var(--color-accent-2-200)\">Kredit-Anteil:<\u002Fspan><strong>{{ tcoPctLoan }}<\u002Fstrong><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:var(--space-3)\"><span style=\"color:var(--color-accent-2-200)\">Unterhalt &amp; Betrieb (Sprit, Vers., Steuer):<\u002Fspan><strong style=\"color:var(--color-accent-300)\">{{ tcoPctRun }}<\u002Fstrong><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:var(--space-1);padding:var(--space-6);border-radius:var(--radius-lg);background:var(--color-accent-100);color:var(--color-accent-900)\">\n            <div style=\"font-family:var(--font-heading);font-size:17px;display:flex;align-items:center;gap:var(--space-2)\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--color-accent-600)\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.7 18-8-14a2 2 0 0 0-3.5 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n              Faustregel für die Haushaltskasse\n            <\u002Fdiv>\n            <p style=\"font-size:14px;line-height:1.6;margin:0\">Die gesamten Auto-Gesamtkosten (Kredit + Unterhalt) sollten idealerweise <strong>maximal 25% Ihres monatlichen Nettoeinkommens<\u002Fstrong> betragen.<\u002Fp>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-3)\">\n              <label style=\"font-size:14px;font-weight:600\">Monatliches Nettoeinkommen (€)<\u002Flabel>\n              <input class=\"input\" type=\"text\" sc-camel-input-mode=\"decimal\" value=\"{{ fIncome.value }}\" sc-camel-on-change=\"{{ fIncome.onChange }}\" sc-camel-on-focus=\"{{ fIncome.onFocus }}\" sc-camel-on-blur=\"{{ fIncome.onBlur }}\" style=\"width:120px;text-align:right;  stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><path d=\"m7 10 5 5 5-5\"><\u002Fpath><path d=\"M12 15V3\"><\u002Fpath><\u002Fsvg>\n            CSV Export\n          <\u002Fbutton>\n          <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ toggleTable }}\" style=\"font-family:var(--font-body);font-size:13px;font-weight:600\">{{ tableBtn }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:var(--space-2);padding:0 var(--space-8) var(--space-6)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);flex-wrap:wrap\">\n          <span style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600;color:var(--color-neutral-700)\">Restschuld im Zeitverlauf<\u002Fspan>\n          <span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ chartStart }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative;height:160px;border-radius:var(--radius-md);background:var(--color-bg);overflow:hidden\">\n          <svg sc-camel-view-box=\"0 0 1000 200\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block\">\n            <path d=\"M0 57H1000M0 107H1000M0 157H1000\" stroke=\"var(--color-divider)\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\" fill=\"none\"><\u002Fpath>\n            <path d=\"{{ chartArea }}\" fill=\"var(--color-accent-2-200)\"><\u002Fpath>\n            <path d=\"{{ chartLine }}\" fill=\"none\" stroke=\"var(--color-accent-2-700)\" stroke-width=\"2.5\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;font-size:12px;color:var(--color-neutral-700)\"><span>Monat 0<\u002Fspan><span>{{ chartMid }}<\u002Fspan><span>{{ chartEnd }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ tableOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-print=\"expand\" style=\"overflow:auto;max-height:420px;margin:0 var(--space-4) var(--space-4);border-radius:var(--radius-lg);background:var(--color-bg)\">\n          <sc-raw-table class=\"table\" style=\"font-size:13px;font-variant-numeric:tabular-nums\">\n            <sc-raw-thead>\n              <sc-raw-tr>\n                <sc-raw-th style=\"position:sticky;top:0;background:var(--color-neutral-200);padding:12px 16px\">Monat<\u002Fsc-raw-th>\n                <sc-raw-th style=\"position:sticky;top:0;background:var(--color-neutral-200);padding:12px 16px;text-align:right\">Ratenzahlung<\u002Fsc-raw-th>\n                <sc-raw-th style=\"position:sticky;top:0;background:var(--color-neutral-200);padding:12px 16px;text-align:right\">Zinsanteil<\u002Fsc-raw-th>\n                <sc-raw-th style=\"position:sticky;top:0;background:var(--color-neutral-200);padding:12px 16px;text-align:right\">Tilgungsanteil<\u002Fsc-raw-th>\n                <sc-raw-th style=\"position:sticky;top:0;background:var(--color-neutral-200);padding:12px 16px;text-align:right\">Sondertilgung<\u002Fsc-raw-th>\n                <sc-raw-th style=\"position:sticky;top:0;background:var(--color-neutral-200);padding:12px 16px;text-align:right\">Restschuld<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                <sc-raw-tr style=\"background:{{ r.bg }}\">\n                  <sc-raw-td style=\"padding:9px 16px;font-weight:600\">{{ r.month }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:9px 16px;text-align:right;font-weight:500\">{{ r.payment }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:9px 16px;text-align:right;color:var(--color-accent-700)\">{{ r.interest }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:9px 16px;text-align:right;color:var(--color-accent-2-700)\">{{ r.principal }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:9px 16px;text-align:right;font-weight:700;color:var(--color-accent-800)\">{{ r.special }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:9px 16px;text-align:right;font-weight:600\">{{ r.balance }}<\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showTips }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-print=\"hide\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:var(--space-6)\">\n        <div class=\"card\" style=\"padding:var(--space-6);gap:var(--space-2)\">\n          <span style=\"width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--color-accent-2-200);color:var(--color-accent-2-900);font-family:var(--font-heading);font-size:18px;margin-bottom:var(--space-2)\">1<\u002Fspan>\n          <div class=\"card-title\">Reparatur-Puffer einkalkulieren<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.6;margin:0;color:var(--color-neutral-800);text-wrap:pretty\">Bei Gebrauchtwagen können spontane Reparaturen anstehen (Verschleißteile, Bremsen, Reifen, Zahnriemen). Behalten Sie stets mindestens 1.000 € – 1.500 € als eiserne Reserve auf dem Tagesgeldkonto.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:var(--space-6);gap:var(--space-2)\">\n          <span style=\"width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--color-accent-200);color:var(--color-accent-900);font-family:var(--font-heading);font-size:18px;margin-bottom:var(--space-2)\">2<\u002Fspan>\n          <div class=\"card-title\">Vollkasko vs. Teilkasko<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.6;margin:0;color:var(--color-neutral-800);text-wrap:pretty\">Laufende Kredite erfordern Schutz: Erleidet der gebrauchte Wagen einen Totalschaden, läuft die Kreditrate weiter. Eine Vollkaskoverversicherung mit GAP-Schutz schützt vor finanzieller Schräglage.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"padding:var(--space-6);gap:var(--space-2)\">\n          <span style=\"width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--color-neutral-300);color:var(--color-neutral-900);font-family:var(--font-heading);font-size:18px;margin-bottom:var(--space-2)\">3<\u002Fspan>\n          <div class=\"card-title\">Anzahlung senkt Zinskosten<\u002Fdiv>\n          <p style=\"font-size:14px;line-height:1.6;margin:0;color:var(--color-neutral-800);text-wrap:pretty\">Schon 20% bis 30% Anzahlung (oder die Inzahlungnahme Ihres alten Autos) senken die Zinsbelastung spürbar und erhöhen die Wahrscheinlichkeit einer schnellen Kreditzusage durch die Bank.<\u002Fp>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isRate }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"card\" style=\"padding:var(--space-6);gap:var(--space-2)\">\n            <span style=\"width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--color-accent-2-700);color:var(--color-bg);margin-bottom:var(--space-2)\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <div class=\"card-title\">Kauf-Empfehlung<\u002Fdiv>\n            <p style=\"font-size:14px;line-height:1.6;margin:0;color:var(--color-neutral-800);text-wrap:pretty\">Mit einer Rate von <strong>{{ monthlyRate }}<\u002Fstrong> und <strong>{{ downFmt }}<\u002Fstrong> Anzahlung liegt Ihr Budgetrahmen bei Fahrzeugen im Bereich von ca. <strong>{{ recRange }}<\u002Fstrong>. Denken Sie daran, ca. 1.000 € Reserve für die Zulassung &amp; eventuelle Erstwartung einzuplanen.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <footer style=\"max-width:1240px;width:100%;margin:0 auto;padding:var(--space-6);font-size:12px;color:var(--color-neutral-700);display:flex;flex-direction:column;gap:2px\">\n    <span>© Gebrauchtwagen Kreditrechner Pro – Kostenloses Online-Tool zur Berechnung von Autokrediten, Unterhalt &amp; Restwert.<\u002Fspan>\n    <span>Alle Angaben ohne Gewähr. Berechnungen stellen kein verbindliches Kreditangebot dar.<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startTab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rate&quot;,&quot;budget&quot;,&quot;compare&quot;,&quot;tco&quot;],&quot;default&quot;:&quot;rate&quot;,&quot;tsType&quot;:&quot;'rate'|'budget'|'compare'|'tco'&quot;},&quot;showTips&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  defaults() {\n    return {\n      tab: null, loanType: 'standard', price: '15000', down: '3000', months: 48, rate: '5.99', balloon: '4500',\n      special: false, specialAmt: '1000', specialMode: 'yearly',\n      maxRate: '250', bDown: '2000', bTerm: '48', bRate: '5.99',\n      cmpA: { price: '15000', down: '3000', term: '48', rate: '5.99', balloon: '0' },\n      cmpB: { price: '15000', down: '3000', term: '60', rate: '5.99', balloon: '0' },\n      fuel: '130', ins: '65', tax: '12', maint: '50', income: '2800'\n    };\n  }\n  loadSaved() {\n    try {\n      const v = JSON.parse(localStorage.getItem('kreditrechner-pro:eingaben') || 'null');\n      if (!v || typeof v !== 'object') return {};\n      const d = this.defaults(), out = {};\n      Object.keys(d).forEach(k => { if (k in v) out[k] = v[k]; });\n      return out;\n    } catch (e) { return {}; }\n  }\n  state = { ...this.defaults(), ...this.loadSaved(), tableOpen: false, focus: null, info: null, printing: false };\n\n  componentDidMount() {\n    this._noWheel = e => { const t = e.target; if (t && t.type === 'number' && document.activeElement === t) t.blur(); };\n    document.addEventListener('wheel', this._noWheel, { passive: true });\n  }\n  componentWillUnmount() { document.removeEventListener('wheel', this._noWheel); }\n  componentDidUpdate() {\n    try {\n      const d = this.defaults(), out = {};\n      Object.keys(d).forEach(k => { out[k] = this.state[k]; });\n      localStorage.setItem('kreditrechner-pro:eingaben', JSON.stringify(out));\n    } catch (e) {}\n  }\n  reset() {\n    try { localStorage.removeItem('kreditrechner-pro:eingaben'); } catch (e) {}\n    this.setState({ ...this.defaults(), focus: null, info: null });\n  }\n\n  fmt(v) { return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(v || 0); }\n  fmtNum(v, dec) { return new Intl.NumberFormat('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(v || 0); }\n  n(v) {\n    if (typeof v === 'number') return v;\n    let t = String(v == null ? '' : v).replace(/[€\\s]/g, '');\n    if (t.indexOf(',') >= 0) t = t.replace(/\\./g, '').replace(',', '.');\n    else if (/^\\d{1,3}(\\.\\d{3})+$/.test(t)) t = t.replace(/\\./g, '');\n    const x = parseFloat(t); return isNaN(x) ? 0 : x;\n  }\n  plain(v, dec) { return dec ? String(Math.round(v * 100) / 100).replace('.', ',') : String(Math.round(v)); }\n  fld(id, raw, setter, dec, shown) {\n    const focused = this.state.focus === id;\n    const num = shown == null ? this.n(raw) : shown;\n    const empty = String(raw == null ? '' : raw).trim() === '';\n    return {\n      value: focused ? String(raw == null ? '' : raw) : (empty ? '' : this.fmtNum(num, dec || 0)),\n      onChange: e => setter(e.target.value),\n      onFocus: e => { const t = e.target; if (!empty) setter(this.plain(num, dec)); this.setState({ focus: id }); setTimeout(() => { try { t.select(); } catch (x) {} }, 0); },\n      onBlur: () => this.setState({ focus: null })\n    };\n  }\n  mEff(a) { const p = (a || 0) / 100; return p > 0 ? Math.pow(1 + p, 1 / 12) - 1 : 0; }\n  annuity(net, r, n, balloon) {\n    if (net <= 0) return 0;\n    if (r > 0) { const f = Math.pow(1 + r, n); return (net - balloon / f) * (r * f) / (f - 1); }\n    return (net - balloon) / n;\n  }\n  schedule(loan, r, months, pay, balloon, isBalloon, specAmt, specMode) {\n    const rows = []; let bal = loan, totalInterest = 0, monthsPaidOff = 0, finalBalance = 0;\n    for (let i = 1; i <= months; i++) {\n      if (bal <= 0) break;\n      const interest = Math.max(0, bal * r);\n      let principal = Math.max(0, pay - interest), special = 0;\n      if (principal >= bal - 0.01) principal = bal;\n      else {\n        const sm = specMode === 'monthly' || (specMode === 'once' && i === 12) || (specMode === 'yearly' && i % 12 === 0);\n        if (specAmt > 0 && sm) special = Math.min(specAmt, bal - principal);\n      }\n      totalInterest += interest;\n      bal -= principal + special;\n      if (bal < 0.01) bal = 0;\n      let due = 0;\n      if (isBalloon && i === months && bal > 0) { due = bal; bal = 0; }\n      monthsPaidOff = i; finalBalance = due;\n      rows.push({ month: i, interest, principal: principal + due, special, payment: principal + interest + special + due, balance: bal });\n    }\n    return { rows, totalInterest, monthsPaidOff, finalBalance };\n  }\n  set(k) { return e => this.setState({ [k]: e.target.value }); }\n  setCmp(o, k) { return e => { const v = e.target.value; this.setState(s => ({ [o]: { ...s[o], [k]: v } })); }; }\n\n  exportCSV(rows) {\n    if (!rows.length) return;\n    const num = v => v.toFixed(2).replace('.', ',');\n    let csv = 'Monat;Ratenzahlung;Zinsanteil;Tilgungsanteil;Sondertilgung;Restschuld\\n';\n    rows.forEach(r => { csv += [r.month, num(r.payment), num(r.interest), num(r.principal), num(r.special), num(r.balance)].join(';') + '\\n'; });\n    const blob = new Blob(['\\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob); a.download = 'Tilgungsplan_Gebrauchtwagen.csv';\n    document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  }\n\n  renderVals() {\n    const s = this.state, fmt = v => this.fmt(v), n = v => this.n(v);\n    const tab = s.tab || this.props.startTab || 'rate';\n    const isBalloon = s.loanType === 'balloon';\n    const setK = k => v => this.setState({ [k]: v });\n    const setC = (o, k) => v => this.setState(st => ({ [o]: { ...st[o], [k]: v } }));\n    const pct = (v, a, b) => Math.min(100, Math.max(0, (n(v) - a) / (b - a) * 100)) + '%';\n    const info = id => { const open = s.info === id; return { open, toggle: () => this.setState({ info: open ? null : id }), bg: open ? 'var(--color-accent-2-700)' : 'var(--color-accent-2-100)', fg: open ? 'var(--color-bg)' : 'var(--color-accent-2-700)' }; };\n\n    const price = Math.max(0, n(s.price));\n    const down = Math.min(price, Math.max(0, n(s.down)));\n    const months = parseInt(s.months) || 48;\n    const annual = Math.max(0, n(s.rate));\n    const net = price - down;\n    const maxBalloon = Math.max(0, Math.min(Math.round(price * 0.6), net));\n    const balloon = isBalloon ? Math.min(net, maxBalloon, Math.max(0, n(s.balloon))) : 0;\n    const r = this.mEff(annual);\n    const pay = this.annuity(net, r, months, balloon);\n    const specAmt = s.special ? n(s.specialAmt) : 0;\n    const base = this.schedule(net, r, months, pay, balloon, isBalloon && balloon > 0, 0, 'yearly');\n    const act = specAmt > 0 ? this.schedule(net, r, months, pay, balloon, isBalloon && balloon > 0, specAmt, s.specialMode) : base;\n    const showBase = act !== base;\n    const effI = act.totalInterest, effB = act.finalBalance;\n    const diffOr = (v, b) => (showBase && Math.abs(b - v) >= 0.01) ? fmt(b) : '';\n    const yrs = months / 12;\n    const yearsText = yrs === 1 ? '1 Jahr' : this.fmtNum(yrs, Number.isInteger(yrs) ? 0 : 1) + ' Jahre';\n\n    let savings = '', savingsTime = '';\n    const saved = base.totalInterest - effI;\n    if (showBase && saved > 0.01) {\n      savings = fmt(saved);\n      const ms = base.monthsPaidOff - act.monthsPaidOff, cut = base.finalBalance - effB;\n      if (ms > 0) savingsTime = '(Laufzeit verkürzt um ' + ms + ' Monat' + (ms > 1 ? 'e' : '') + ')';\n      else if (cut > 0.01) savingsTime = '(Schlussrate sinkt um ' + fmt(cut) + ')';\n    }\n\n    const tilgung = Math.max(0, net - effB);\n    const segDefs = [['Anzahlung', down, 'var(--color-accent-2-400)'], ['Tilgung (Laufend)', tilgung, 'var(--color-bg)'], ['Zinskosten', effI, 'var(--color-accent)'], ['Schlussrate', effB, 'var(--color-accent-300)']].filter(d => d[1] > 0);\n    const grand = segDefs.reduce((a, d) => a + d[1], 0);\n    const segments = segDefs.map(d => ({ label: d[0], value: fmt(d[1]), color: d[2], grow: grand > 0 ? Math.round(d[1] / grand * 1000) : 1, key: d[0] }));\n\n    const estValue = price * Math.pow(0.90, months / 12);\n\n    const W = 1000, H = 200, TOP = 14;\n    let chartLine = '', chartArea = '';\n    if (net > 0 && act.rows.length) {\n      const pts = [[0, net]];\n      act.rows.forEach((rw, i) => { if (i === act.rows.length - 1 && effB > 0) pts.push([rw.month, effB]); pts.push([rw.month, rw.balance]); });\n      const xy = p => (p[0] / months * W).toFixed(1) + ' ' + (H - p[1] / net * (H - TOP)).toFixed(1);\n      chartLine = 'M' + pts.map(xy).join(' L');\n      chartArea = chartLine + ' L' + (pts[pts.length - 1][0] / months * W).toFixed(1) + ' ' + H + ' L0 ' + H + ' Z';\n    }\n    const midRo
